<!DOCTYPE html>
<html>
<body>

<h2>Survey Diagnostic 🔥</h2>

<pre id="result">Checking...</pre>

<script>
async function run() {

let fingerprint =
navigator.userAgent +
screen.width +
screen.height +
navigator.language +
navigator.platform;

fetch("https://api.ipify.org?format=json")
.then(r => r.json())
.then(ipData => {

let ip = ipData.ip;

fetch("https://ipapi.co/" + ip + "/json/")
.then(r => r.json())
.then(data => {

document.getElementById("result").innerText =
"IP: " + data.ip + "\n\n" +

"Country: " + data.country_name + "\n" +
"Region: " + data.region + "\n" +
"ISP: " + data.org + "\n" +
"ASN: " + data.asn + "\n\n" +

"Timezone: " + data.timezone + "\n" +
"Language: " + navigator.language + "\n" +
"Platform: " + navigator.platform + "\n\n" +

"Fingerprint:\n" + btoa(fingerprint);

});

});

}

run();
</script>

</body>
</html>
