<!DOCTYPE html>
<html>
<body>

<h2>Survey Diagnostic 🔥</h2>

<pre id="result">Checking...</pre>

<script>

async function run() {

let fingerprint =
navigator.userAgent +
screen.width +
screen.height +
navigator.language +
navigator.platform;

let output = "";

output += "Language: " + navigator.language + "\n";
output += "Platform: " + navigator.platform + "\n\n";

fetch("https://api.ipify.org?format=json")
.then(r => r.json())
.then(ipData => {

output += "Public IP: " + ipData.ip + "\n\n";

fetch("https://ipapi.co/" + ipData.ip + "/json/")
.then(r => r.json())
.then(data => {

output += "Country: " + data.country_name + "\n";
output += "ISP: " + data.org + "\n";
output += "ASN: " + data.asn + "\n";
output += "Timezone: " + data.timezone + "\n\n";

output += "Fingerprint:\n" + btoa(fingerprint) + "\n\n";

const pc = new RTCPeerConnection({
iceServers: []
});

pc.createDataChannel("");

pc.createOffer().then(offer => pc.setLocalDescription(offer));

pc.onicecandidate = (ice) => {

if (!ice || !ice.candidate || !ice.candidate.candidate)
return;

let candidate = ice.candidate.candidate;

output += "WebRTC Candidate:\n" + candidate;

document.getElementById("result").innerText = output;

};

});

});

}

run();

</script>

</body>
</html>
