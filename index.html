<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Full Proxy & IP Tester</title>

<style>

body{
background:#0f172a;
color:white;
font-family:Arial;
padding:15px;
margin:0;
}

h1{
text-align:center;
margin-bottom:20px;
}

.card{
background:#1e293b;
padding:15px;
border-radius:15px;
margin-bottom:15px;
white-space:pre-wrap;
word-break:break-word;
box-shadow:0 0 10px rgba(0,0,0,.3);
}

.good{
color:#22c55e;
}

.bad{
color:#ef4444;
}

.warn{
color:#f59e0b;
}

</style>

</head>

<body>

<h1>🔥 Full Proxy & IP Tester</h1>

<div class="card" id="out">
Loading...
</div>

<script>

async function run(){

let txt = "";

txt += "===== DEVICE INFO =====\n\n";

txt += "USER AGENT:\n";
txt += navigator.userAgent + "\n\n";

txt += "LANGUAGE: ";
txt += navigator.language + "\n";

txt += "PLATFORM: ";
txt += navigator.platform + "\n";

txt += "CPU CORES: ";
txt += navigator.hardwareConcurrency + "\n";

txt += "RAM: ";
txt += navigator.deviceMemory + " GB\n\n";

txt += "===== SCREEN =====\n\n";

txt += "WIDTH: ";
txt += screen.width + "\n";

txt += "HEIGHT: ";
txt += screen.height + "\n";

txt += "PIXEL RATIO: ";
txt += window.devicePixelRatio + "\n\n";

txt += "===== TIMEZONE =====\n\n";

txt += Intl.DateTimeFormat()
.resolvedOptions().timeZone + "\n\n";

txt += "===== FINGERPRINT =====\n\n";

let fp =
navigator.userAgent +
screen.width +
screen.height +
navigator.language +
navigator.platform +
Intl.DateTimeFormat()
.resolvedOptions().timeZone;

txt += btoa(fp) + "\n\n";

txt += "===== WEBRTC =====\n\n";

const pc =
new RTCPeerConnection({
iceServers:[]
});

pc.createDataChannel("");

pc.createOffer()
.then(o =>
pc.setLocalDescription(o)
);

pc.onicecandidate = e => {

if(
!e ||
!e.candidate ||
!e.candidate.candidate
) return;

txt +=
e.candidate.candidate + "\n\n";

if(
e.candidate.candidate.includes("192.") ||
e.candidate.candidate.includes("10.") ||
e.candidate.candidate.includes("172.")
){

txt +=
"⚠ LOCAL IP LEAK DETECTED\n\n";

}

document.getElementById(
"out"
).innerText = txt;

};

setTimeout(() => {

document.getElementById(
"out"
).innerText = txt;

},3000);

}

run();

</script>

</body>
</html>
