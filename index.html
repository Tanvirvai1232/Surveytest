<!DOCTYPE html>
<html>
<head>

<title>Survey Anti-Fraud Dashboard</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
background:#0f172a;
color:white;
font-family:Arial;
padding:15px;
margin:0;
}

.title{
font-size:26px;
font-weight:bold;
text-align:center;
margin-bottom:20px;
}

.card{
background:#1e293b;
padding:15px;
border-radius:15px;
margin-bottom:15px;
box-shadow:0 0 10px rgba(0,0,0,.3);
}

.good{
color:#22c55e;
font-weight:bold;
}

.bad{
color:#ef4444;
font-weight:bold;
}

.warn{
color:#f59e0b;
font-weight:bold;
}

pre{
white-space:pre-wrap;
word-wrap:break-word;
font-size:14px;
line-height:1.5;
}

</style>

</head>

<body>

<div class="title">
🔥 Survey Anti-Fraud Dashboard
</div>

<div class="card">
<pre id="output">Loading...</pre>
</div>

<script>

async function run() {

try {

const ipRes =
await fetch(
"https://api.ipify.org?format=json"
);

const ipData =
await ipRes.json();

const ip = ipData.ip;

const infoRes =
await fetch(
"https://ipapi.co/" + ip + "/json/"
);

const data =
await infoRes.json();

let isp =
(data.org || "").toLowerCase();

let type =
"ISP/UNKNOWN";

let risk =
"MEDIUM";

const cloudList = [
"google",
"amazon",
"aws",
"azure",
"digitalocean",
"ovh",
"linode",
"vultr",
"oracle",
"microsoft"
];

const mobileList = [
"t-mobile",
"verizon",
"att",
"at&t",
"spectrum",
"comcast",
"vodafone",
"airtel",
"jio"
];

if (
cloudList.some(
x => isp.includes(x)
)
) {

type =
"DATACENTER/CLOUD";

risk =
"HIGH";

}

else if (
mobileList.some(
x => isp.includes(x)
)
) {

type =
"RESIDENTIAL/MOBILE";

risk =
"LOW";

}

let output = "";

output +=
"TYPE: " + type + "\n";

output +=
"RISK: " + risk + "\n\n";

if (risk === "LOW") {

output +=
"STATUS: ✔ CLEAN\n\n";

}

else {

output +=
"STATUS: ❌ RISKY\n\n";

}

output +=
"IP: " + ip + "\n";

output +=
"ISP: " + data.org + "\n";

output +=
"ASN: " + data.asn + "\n";

output +=
"Country: " +
data.country_name + "\n";

output +=
"Region: " +
data.region + "\n";

output +=
"Timezone: " +
data.timezone + "\n\n";

output +=
"Language: " +
navigator.language + "\n";

output +=
"Platform: " +
navigator.platform + "\n\n";

let fp =
navigator.userAgent +
screen.width +
screen.height +
navigator.language +
navigator.platform;

let fingerprint =
btoa(fp);

let oldfp =
localStorage.getItem(
"fingerprint"
);

if (!oldfp) {

localStorage.setItem(
"fingerprint",
fingerprint
);

}

output +=
"Fingerprint:\n" +
fingerprint + "\n\n";

if (
oldfp &&
oldfp !== fingerprint
) {

output +=
"⚠ Fingerprint Changed\n\n";

}

const pc =
new RTCPeerConnection({
iceServers:[]
});

pc.createDataChannel("");

pc.createOffer()
.then(
offer =>
pc.setLocalDescription(
offer
)
);

pc.onicecandidate =
(ice) => {

if (
!ice ||
!ice.candidate ||
!ice.candidate.candidate
)
return;

let cand =
ice.candidate.candidate;

output +=
"WebRTC:\n" +
cand +
"\n\n";

if (
cand.includes("192.168") ||
cand.includes("10.") ||
cand.includes("172.")
) {

output +=
"⚠ LOCAL IP LEAK DETECTED\n";

}

document.getElementById(
"output"
).innerText =
output;

};

}

catch(err){

document.getElementById(
"output"
).innerText =
"ERROR:\n\n" + err;

}

}

run();

</script>

</body>
</html>
