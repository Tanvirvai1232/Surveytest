<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survey Dashboard</title>

<style>

body{
background:#0f172a;
color:white;
font-family:Arial;
padding:15px;
}

.box{
background:#1e293b;
padding:15px;
border-radius:15px;
white-space:pre-wrap;
word-break:break-word;
}

h1{
text-align:center;
}

</style>

</head>

<body>

<h1>🔥 Survey Dashboard</h1>

<div class="box" id="out">
Loading...
</div>

<script>

async function start(){

try{

const res =
await fetch("https://ipwho.is/");

const d =
await res.json();

let isp =
(d.connection.isp || "").toLowerCase();

let type =
"ISP/UNKNOWN";

let risk =
"MEDIUM";

if(
isp.includes("google") ||
isp.includes("amazon") ||
isp.includes("aws") ||
isp.includes("azure") ||
isp.includes("ovh") ||
isp.includes("digitalocean") ||
isp.includes("linode") ||
isp.includes("vultr")
){

type =
"DATACENTER/CLOUD";

risk =
"HIGH";

}

if(
isp.includes("mobile") ||
isp.includes("wireless") ||
isp.includes("telecom") ||
isp.includes("spectrum")
){

type =
"RESIDENTIAL/MOBILE";

risk =
"LOW";

}

let fp =
navigator.userAgent +
screen.width +
screen.height +
navigator.language;

let text = "";

text +=
"TYPE: " + type + "\n";

text +=
"RISK: " + risk + "\n\n";

text +=
"IP: " + d.ip + "\n";

text +=
"ISP: " + d.connection.isp + "\n";

text +=
"ASN: " + d.connection.asn + "\n";

text +=
"COUNTRY: " + d.country + "\n";

text +=
"CITY: " + d.city + "\n";

text +=
"TIMEZONE: " + d.timezone.id + "\n\n";

text +=
"LANGUAGE: " +
navigator.language + "\n";

text +=
"PLATFORM: " +
navigator.platform + "\n\n";

text +=
"FINGERPRINT:\n" +
btoa(fp) + "\n\n";

const pc =
new RTCPeerConnection({
iceServers:[]
});

pc.createDataChannel("");

pc.createOffer()
.then(o=>pc.setLocalDescription(o));

pc.onicecandidate = e => {

if(
!e ||
!e.candidate ||
!e.candidate.candidate
) return;

text +=
"WEBRTC:\n" +
e.candidate.candidate;

document.getElementById(
"out"
).innerText = text;

};

}
catch(err){

document.getElementById(
"out"
).innerText =
"ERROR:\n" + err;

}

}

start();

</script>

</body>
</html>
