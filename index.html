<!DOCTYPE html>
<html>
<body>

<h2>ASN Intelligence System 🔥</h2>

<pre id="result">Checking...</pre>

<script>

async function run() {

try {

const ipRes = await fetch("https://api.ipify.org?format=json");
const ipData = await ipRes.json();

const infoRes = await fetch("https://ipapi.co/" + ipData.ip + "/json/");
const data = await infoRes.json();

let isp = (data.org || "").toLowerCase();

let type = "ISP/UNKNOWN";
let risk = "MEDIUM";

const cloudList = [
"google",
"amazon",
"aws",
"azure",
"digitalocean",
"ovh",
"linode",
"vultr",
"oracle",
"microsoft"
];

const mobileList = [
"t-mobile",
"verizon",
"att",
"at&t",
"spectrum",
"comcast",
"vodafone",
"airtel",
"jio"
];

if (cloudList.some(x => isp.includes(x))) {
type = "DATACENTER/CLOUD";
risk = "HIGH";
}

else if (mobileList.some(x => isp.includes(x))) {
type = "RESIDENTIAL/MOBILE";
risk = "LOW";
}

let output = "";

output += "TYPE: " + type + "\n";
output += "RISK: " + risk + "\n\n";

output += "Public IP: " + ipData.ip + "\n";
output += "ISP: " + data.org + "\n";
output += "ASN: " + data.asn + "\n";
output += "Country: " + data.country_name + "\n";
output += "Region: " + data.region + "\n";
output += "Timezone: " + data.timezone + "\n\n";

output += "Language: " + navigator.language + "\n";
output += "Platform: " + navigator.platform + "\n";

document.getElementById("result").innerText = output;

}

catch(err) {

document.getElementById("result").innerText =
"ERROR:\n" + err;

}

}

run();

</script>

</body>
</html>
