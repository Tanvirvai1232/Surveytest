<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survey Dashboard</title>

<style>
body{
background:#0f172a;
color:white;
font-family:Arial;
padding:15px;
}

.card{
background:#1e293b;
padding:15px;
border-radius:15px;
white-space:pre-wrap;
word-break:break-word;
}

h1{
text-align:center;
}
</style>

</head>

<body>

<h1>🔥 Survey Dashboard</h1>

<div class="card" id="out">
Loading...
</div>

<script>

let txt = "";

txt += "USER AGENT:\n";
txt += navigator.userAgent + "\n\n";

txt += "LANGUAGE: ";
txt += navigator.language + "\n";

txt += "PLATFORM: ";
txt += navigator.platform + "\n\n";

txt += "SCREEN:\n";
txt += screen.width + "x" + screen.height + "\n\n";

let fp =
navigator.userAgent +
screen.width +
screen.height +
navigator.language +
navigator.platform;

txt += "FINGERPRINT:\n";
txt += btoa(fp) + "\n\n";

const pc =
new RTCPeerConnection({
iceServers:[]
});

pc.createDataChannel("");

pc.createOffer()
.then(o => pc.setLocalDescription(o));

pc.onicecandidate = e => {

if(
!e ||
!e.candidate ||
!e.candidate.candidate
) return;

txt += "WEBRTC:\n";
txt += e.candidate.candidate;

document.getElementById(
"out"
).innerText = txt;

};

setTimeout(() => {

document.getElementById(
"out"
).innerText = txt;

},3000);

</script>

</body>
</html>
