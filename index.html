<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Survey Dashboard</title>

<style>

body{
background:#111827;
color:white;
font-family:Arial;
padding:15px;
}

.box{
background:#1f2937;
padding:15px;
border-radius:12px;
white-space:pre-wrap;
word-break:break-word;
}

h1{
text-align:center;
}

</style>

</head>

<body>

<h1>🔥 Survey Dashboard</h1>

<div class="box" id="out">
Loading...
</div>

<script>

fetch("https://ipapi.co/json/")
.then(r => r.json())
.then(d => {

let isp =
(d.org || "").toLowerCase();

let type =
"UNKNOWN";

let risk =
"MEDIUM";

if(
isp.includes("google") ||
isp.includes("amazon") ||
isp.includes("aws") ||
isp.includes("azure") ||
isp.includes("ovh") ||
isp.includes("digitalocean")
){

type =
"DATACENTER/CLOUD";

risk =
"HIGH";

}

else{

type =
"RESIDENTIAL/MOBILE";

risk =
"LOW";

}

let fp =
navigator.userAgent +
screen.width +
screen.height +
navigator.language;

let txt = "";

txt +=
"TYPE: " + type + "\n";

txt +=
"RISK: " + risk + "\n\n";

txt +=
"IP: " + d.ip + "\n";

txt +=
"ISP: " + d.org + "\n";

txt +=
"ASN: " + d.asn + "\n";

txt +=
"COUNTRY: " + d.country_name + "\n";

txt +=
"TIMEZONE: " + d.timezone + "\n\n";

txt +=
"LANGUAGE: " +
navigator.language + "\n";

txt +=
"PLATFORM: " +
navigator.platform + "\n\n";

txt +=
"FINGERPRINT:\n" +
btoa(fp);

document.getElementById(
"out"
).innerText = txt;

})
.catch(e => {

document.getElementById(
"out"
).innerText =
"ERROR:\n" + e;

});

</script>

</body>
</html>
